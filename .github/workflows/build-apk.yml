name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Same debug key as your machine, so CI APKs install over existing ones
      # without uninstalling. Without the secret, CI uses a throwaway key.
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        if: env.DEBUG_KEYSTORE_B64 != ''
        run: mkdir -p ~/.android && echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: roblox-keeper-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
